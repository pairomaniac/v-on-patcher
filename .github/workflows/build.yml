name: "Build"

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; the release job takes write for the upload.
permissions:
  contents: read

jobs:
  # v-on-patcher.py carries the assembled bytes rather than assembling on demand,
  # so the assembly and the blobs in the script can drift apart and everything
  # will still look fine: the repository is self-consistent and the shipped
  # patcher installs last week's code. This job is the only thing that
  # notices. It runs on every push, not just on a tag, because by tag time the
  # bad blob is already what people download.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the launcher check compares commit dates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          nasm -v

      - run: pip install pyflakes pillow

      # The window checks need a display. xvfb is what gives them one; with
      # nothing here tools/guitest.py skips itself and says so, which would
      # be a green run that tested no window at all.
      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      # One runner, the same one used locally, so the two cannot drift.
      # It skips the checks that need a copy of the game and says so.
      #
      # tables   patch tables, blobs and the banner bitmap, for every build
      #          the patcher has tables for: lengths, bounds, cross-patch
      #          collisions, the intra-patch overlap the XInput routine
      #          relies on, and every banner tile index in range.
      # asm      reassembles asm/ and compares against the committed blobs,
      #          links every blob for every build, and checks the two
      #          placeholders the apply-time sections fill - the mistakes
      #          nothing downstream notices.
      #          Writes nothing; nasm works in a temporary directory.
      # ui       reassembles asm/ui.asm (built by tools/uibuild.py rather
      #          than asm/build.py) and compares against the committed
      #          UI_CODE. nasm is installed above, so this runner always
      #          gets the real reassembly, never uibuild's no-toolchain
      #          fingerprint fallback.
      # net      two mingw versions do not produce identical bytes, so the
      #          blob records a hash of net/dpctrl.c and this compares
      #          against that: "was the blob built from this source".
      # disc     the disc reader, against images the test builds itself, in
      #          every sector layout and every way a cue sheet gets written.
      # gui      the window, opened and driven under xvfb: what each button
      #          is offered for, that a copy holds them down, and that the
      #          layout ends where it should. None of these raise on their
      #          own - the wrong thing is simply on screen - so each one
      #          asserts the property.
      # lint     pyflakes over every script in the repository.
      # tree     a blob regenerated but not committed, and proof that the
      #          --check runs above really are read-only.
      - name: Checks
        run: xvfb-run -a -s "-screen 0 1600x1400x24" python3 tools/check.py --colour always

      # Separately, prove the C still builds and still exports what the
      # game imports. Nothing here compares against the committed blob.
      - name: Netplay DLL compiles
        run: |
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
          i686-w64-mingw32-gcc -O2 -shared -o /tmp/dpctrl.dll \
              net/dpctrl.c net/dpctrl.def -lws2_32 -lwinmm \
              -Wl,--enable-stdcall-fixup
          for sym in InitialDirectPlay DestroyDirectPlay SendDirectPlay \
                     SendDirectPlayWaitMessage ReceiveDirectPlay \
                     SWDataSendReceive CloseProvider; do
            i686-w64-mingw32-objdump -p /tmp/dpctrl.dll | grep -q "$sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          i686-w64-mingw32-objdump -p /tmp/dpctrl.dll | grep -i 'DLL Name'
          i686-w64-mingw32-objdump -p /tmp/dpctrl.dll | grep -qi dplayx \
            && { echo "still linked against DirectPlay"; exit 1; }
          echo "ok"

      # The committed launcher (see the windows job) has to be signed, and
      # committed no earlier than the files it is built from. Otherwise a
      # change to launcher/ would never reach a release.
      - name: Committed launcher
        run: |
          if [ ! -f launcher/v-on-patcher.exe ]; then
            echo 'none committed: builds use a fresh one'
            exit 0
          fi
          sudo apt-get install -y -qq osslsigncode
          out=$(osslsigncode verify -in launcher/v-on-patcher.exe 2>&1) || true
          echo "$out" | grep -q 'Signature verification: ok' \
            || { echo "$out"; echo '::error::launcher/v-on-patcher.exe is not validly signed'; exit 1; }
          exe=$(git log -1 --format=%ct -- launcher/v-on-patcher.exe)
          src=$(git log -1 --format=%ct -- launcher/launcher.c launcher/launcher.rc launcher/build.bat assets/icon.ico)
          [ "$exe" -ge "$src" ] \
            || { echo '::error::launcher/v-on-patcher.exe is older than its source: delete it and commit the one the next tag signs'; exit 1; }
          echo 'signed, and newer than its source'

      # What this job cannot do is touch a real copy of the game, so the
      # checks that need one are skipped here. Run them by hand before
      # tagging, once per build - each runs against every folder in
      # ~/.vo-test and is named by build, because a table can only be
      # wrong on the build it is for:
      #
      #     python3 tools/check.py
      #
      # offsets  the only check that catches a wrong offset
      # banner   the only check that proves the title prompt reads back as
      #          it was written, since the artwork is not here either
      # credit   the same proof for the credit line in the ending roll
      # uiemu    the resolution blob run under Unicorn, on the retail file

  # Builds on every push to a branch above, on a tag, and on demand from
  # the Actions tab. Pull requests are left out: the push that follows the
  # merge builds the same tree.
  #
  # A push build is an unsigned artifact and nothing else. Artifacts keep
  # for 90 days, so the last few commits are always downloadable without
  # tagging anything. A tag build hands its unzipped build to the sign job,
  # and only the release job after it reaches the release page.
  #
  # The build is Python as python.org ships it, unpacked into _internal
  # with the script, and a small launcher beside it. No PyInstaller: its
  # bootloader and packed archive are what scanners flag.
  windows:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The Python the release carries, pinned to the patch release so each
      # release ships the same PSF-signed files. 3.12.10 is the last 3.12
      # with Windows binaries.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      # The source carries no version. A tag build takes it from the tag, so
      # the tag and the zip names cannot disagree; anything else takes the
      # short SHA, so a downloaded artifact says which commit built it.
      # The window title, --version and the zip names read this one line.
      - name: Stamp the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          python - "$version" <<'EOF'
          import pathlib, re, sys
          src = pathlib.Path('v-on-patcher.py')
          text, n = re.subn(r"^VERSION = '.*'$", "VERSION = '%s'" % sys.argv[1],
                            src.read_text(encoding='utf-8'), count=1, flags=re.M)
          if n != 1:
              raise SystemExit('no VERSION line in v-on-patcher.py')
          src.write_text(text, encoding='utf-8', newline='\n')
          EOF
          grep '^VERSION = ' v-on-patcher.py

      # _internal: the Python above, certifi (the CA list the cnc-ddraw
      # download falls back on), the stamped script and the netplay DLL.
      - name: Bundle
        shell: bash
        run: |
          pip install -q certifi
          python tools/bundle.py dist/v-on-patcher
          for f in pythonw.exe python312._pth python312.zip DLLs/_tkinter.pyd \
                   Lib/site-packages/certifi/cacert.pem v-on-patcher.py net/dpctrl.dll; do
            [ -f "dist/v-on-patcher/_internal/$f" ] || { echo "missing from _internal: $f"; exit 1; }
          done

      # The launcher is compiled on every build so its source keeps
      # building, but what ships is the signed copy committed as
      # launcher/v-on-patcher.exe: the same bytes every release, so the
      # reputation it earns with scanners and SmartScreen carries over.
      # With none committed, the fresh one goes in and a tag signs it.
      - name: Launcher
        shell: cmd
        run: |
          if not exist build mkdir build
          call launcher\build.bat "%GITHUB_WORKSPACE%\build\v-on-patcher.exe"

      - name: Launcher into the bundle
        shell: bash
        run: |
          if [ -f launcher/v-on-patcher.exe ]; then
            cp launcher/v-on-patcher.exe dist/v-on-patcher/
            echo 'the committed launcher'
          else
            cp build/v-on-patcher.exe dist/v-on-patcher/
            echo 'a fresh launcher, unsigned'
          fi

      # Through the launcher, --selfcheck: it finds the script, passes the
      # arguments on, and the tables check out. The bundled Python on its
      # own: it imports what the window and the download need and opens Tk.
      # Then a script that raises: the launcher has to return the failure
      # and pass Python's traceback on. The Python files' signatures are
      # printed, not checked.
      #
      # On a crash the launcher can put up a message box and wait for a
      # click, so the timeout is what makes that a failed step instead of a
      # hung job.
      - name: The exe starts
        shell: bash
        run: |
          cd dist/v-on-patcher
          timeout 60 ./v-on-patcher.exe --selfcheck
          timeout 60 _internal/python.exe -c "import tkinter, ssl, certifi, ctypes, urllib.request; r = tkinter.Tk(); r.destroy(); print('Tk', tkinter.TkVersion, '|', ssl.OPENSSL_VERSION)"
          powershell -NoProfile -Command "Get-AuthenticodeSignature _internal\python*.dll, _internal\pythonw.exe, _internal\DLLs\_tkinter.pyd | Format-Table Status, @{n='Signer';e={\$_.SignerCertificate.Subject}}, Path -AutoSize -Wrap"
          rm -rf ../../crash && cp -r . ../../crash && cd ../../crash
          echo "raise RuntimeError('launcher test')" > _internal/v-on-patcher.py
          if timeout 60 ./v-on-patcher.exe 2> stderr.txt; then
            echo 'a script that raised exited 0'; exit 1
          fi
          grep -q "RuntimeError: launcher test" stderr.txt \
            || { cat stderr.txt; echo 'the traceback did not come through'; exit 1; }
          echo 'the launcher runs the script, returns its failures and passes their tracebacks on'

      # To the log, not an asset: a checksum beside its own binary proves
      # nothing. The VirusTotal line is a lookup, not an upload: it says
      # whether anyone has already scanned this exact file, and where.
      - name: Checksum
        shell: bash
        run: |
          cd dist/v-on-patcher && sha256sum v-on-patcher.exe
          echo "VirusTotal: https://www.virustotal.com/gui/file/$(sha256sum v-on-patcher.exe | cut -c1-64)"

      # Linux users run the script, so ship it too. Strip CR or the shebang
      # breaks when it is run directly.
      - name: Stage the script
        shell: bash
        run: |
          python - <<'EOF'
          import pathlib, re, shutil
          src = pathlib.Path('v-on-patcher.py')
          text = src.read_bytes().replace(b'\r\n', b'\n')
          version = re.search(rb"^VERSION = '(.*)'$", text, re.M).group(1).decode()
          pathlib.Path('dist/v-on-patcher-%s.py' % version).write_bytes(text)
          shutil.copy('net/dpctrl.dll', 'dist/dpctrl.dll')
          print('staged v-on-patcher-%s.py and dpctrl.dll' % version)
          EOF
          if grep -q $'\r' dist/v-on-patcher-*.py; then
            echo 'a CR survived - ./v-on-patcher.py would not run on Linux'
            exit 1
          fi
          ls -l dist/

      # Tagged builds carry the tag, everything else the short SHA, so a
      # folder of downloads says which commit each one came from.
      - name: Name the artifact
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "artifact=v-on-patcher-$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "artifact=v-on-patcher-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # Two zips: -win with the exe and _internal/ at its top, -python with
      # the script and the netplay DLL beside it (tools/package.py). Not
      # -src: GitHub adds its own "Source code" zip to every release, and
      # two of those confuse.
      - name: Zip
        if: github.ref_type != 'tag'
        shell: bash
        run: python tools/package.py dist "$artifact"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: ${{ env.artifact }}
          path: dist/*.zip

      # A tag's build goes to the sign job unzipped: the launcher is signed
      # before anything is packed.
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: unsigned
          path: dist/
          retention-days: 1

  # Signs the tag's launcher with the Certum cloud certificate through
  # ssign, on Linux, and zips the result; a launcher committed signed ships
  # as it is. The credentials are secrets of the `signing` environment,
  # which only v* tags can use (Settings -> Environments -> signing ->
  # Deployment branches and tags); no other job and no other ref can read
  # them. With a required reviewer set there, the
  # job waits for approval on the run's page before it starts.
  #
  # CERTUM_EMAIL is the SimplySign account's e-mail; CERTUM_OTP is the whole
  # otpauth:// URI from the SimplySign QR code, not the bare seed, so the
  # TOTP algorithm is read from it rather than assumed. The URI signs as its
  # owner for as long as it is valid: if it leaks, re-issue the QR code.
  sign:
    needs: windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: dist

      # Signing the committed launcher again would change its bytes.
      - name: Signed already?
        id: signed
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          if osslsigncode extract-signature -in dist/v-on-patcher/v-on-patcher.exe -out /tmp/signature >/dev/null 2>&1; then
            echo 'the launcher is the committed, signed one'
            echo 'yes=true' >> "$GITHUB_OUTPUT"
          fi

      # Built from a pinned commit with its own lockfile, not the latest
      # crate: this binary is handed the signing credentials.
      - name: ssign, pinned
        if: steps.signed.outputs.yes != 'true'
        run: |
          cargo install --locked --git https://github.com/Le-Syl21/ssign \
            --rev 2cc2b1a6f5b5abe4695b184cb806621b3b355ad2 ssign
          ssign --version

      - name: Sign
        if: steps.signed.outputs.yes != 'true'
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          ssign -n "V-On Patcher" -u "https://github.com/$GITHUB_REPOSITORY" \
            dist/v-on-patcher/v-on-patcher.exe

      # ssign does not verify its own output. A signature whose digest does
      # not match, or one without a timestamp - invalid once the certificate
      # expires - fails the job here instead of reaching the release.
      - name: Verify
        run: |
          out=$(osslsigncode verify -in dist/v-on-patcher/v-on-patcher.exe 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q MISMATCH; then echo '::error::the Authenticode digest does not match'; exit 1; fi
          if echo "$out" | grep -q 'Timestamp is not available'; then echo '::error::the signature has no timestamp'; exit 1; fi
          echo "$out" | grep -q 'Signature verification: ok' || { echo '::error::the signature did not verify'; exit 1; }

      - name: Checksum
        run: |
          cd dist/v-on-patcher && sha256sum v-on-patcher.exe
          echo "VirusTotal: https://www.virustotal.com/gui/file/$(sha256sum v-on-patcher.exe | cut -c1-64)"

      - name: Zip
        run: python3 tools/package.py dist "v-on-patcher-$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: v-on-patcher-${{ github.ref_name }}
          path: dist/*.zip

  # The only job with write access, and it holds no signing secrets.
  release:
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v-on-patcher-${{ github.ref_name }}
          path: dist

      # gh is preinstalled on the runner, so no third party action is needed
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
